# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/AgentManifest.yaml
name: benefits-review
displayName: "Benefits Review Agent"
description: >
  AI-assisted benefits benchmarking agent
  Accepts structured company and market payloads with a datapoints catalog,
  processes 9 benefit topics in parallel using Azure OpenAI, validates outputs,
  and returns a structured Benefits Review report.
parameters:
  type: object
  properties: {}
metadata:
  tags:
    - AI Agent Hosting
    - Invocations Protocol
    - Bring Your Own
    - Python
    - Benefits Analysis
template:
  name: benefits-review
  kind: hosted
  protocols:
    - protocol: invocations
      version: 1.0.0
  environment_variables:
    # FOUNDRY_PROJECT_ENDPOINT and APPLICATIONINSIGHTS_CONNECTION_STRING
    # are injected by the platform (hosted) and translated by azd (local)
    # — do NOT declare them here.
    #
    # Model deployment name — resolved from the resources section below.
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
